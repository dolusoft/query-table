name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The whole job takes a few minutes; a hung browser run must not hold a
    # runner for the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The pnpm version is the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm contract:check
      # The JSON Schema of the protocol is generated from its constants.
      - run: pnpm schema:check
      - run: pnpm playground:build
      - run: pnpm test:coverage

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Downloads Chromium only on a cache miss; system libraries are always
      # installed because the runner image does not keep them between jobs.
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:browser
        timeout-minutes: 5
      # Render counts against scripts/render-budget.json (PRINCIPLES.md P8).
      - run: pnpm check:renders
        timeout-minutes: 5
      # One build of dist/ serves the three checks below.
      - run: pnpm build
      - run: pnpm check:package
      # Fails when the package cost passes the budget.
      - run: pnpm check:size
      - run: pnpm api:check
      # The v3 packages: built, linted as packages (publint, attw), their
      # sources and dist/ checked against the dependency allow-list, then
      # each consumer fixture against scripts/package-size-budget.json (P8).
      - run: pnpm build:packages
      - run: pnpm check:packages
      - run: pnpm check:deps
      - run: pnpm check:package-size

      # The .NET sample of docs/guide/protocol.md: built and run against the
      # JSON Schema (the TypeScript samples are checked by typecheck and vitest).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet run --project docs/guide/examples/dotnet -- "$GITHUB_WORKSPACE"
