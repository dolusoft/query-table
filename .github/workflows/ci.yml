name: CI

# `v3/**`: the v3 pull requests are stacked, each based on the one before.
# release.yml calls this workflow on a tag, so a release runs the same checks.
on:
  push:
    branches: [main, next, 'v3/**']
  pull_request:
    branches: [main, next, 'v3/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  # On a workflow_call the caller's workflow name keeps the group apart from
  # the CI run of the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Three jobs run side by side; the longest sets the wall time.
# `verify` is the required status check: it passes only when all three pass.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pnpm version is the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm contract:check
      # The JSON Schema of the protocol is generated from its constants.
      - run: pnpm schema:check
      - run: pnpm conformance:check
      - run: pnpm playground:build
      - run: pnpm test:coverage

      # The .NET sample of docs/guide/protocol.md: built and run against the
      # JSON Schema (the TypeScript samples are checked by typecheck and vitest).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet run --project docs/guide/examples/dotnet -- "$GITHUB_WORKSPACE"

  browser:
    runs-on: ubuntu-latest
    # A hung browser run must not hold a runner for the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/chromium
      - run: pnpm test:browser
        timeout-minutes: 5
      # Render counts against scripts/render-budget.json (PRINCIPLES.md P8).
      - run: pnpm check:renders
        timeout-minutes: 5

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # One build of the dist/ of the three packages serves every check below.
      - run: pnpm build
      # Linted as packages (publint, attw); sources and dist/ against the
      # dependency allow-list.
      - run: pnpm check:package
      # No stylesheet or scripted animation in dist/ or the tarballs (P5).
      - run: pnpm check:no-css-leak
      - run: pnpm check:deps
      # Size (P8): the Vue fixtures against scripts/consumer-size-budget.json,
      # the protocol and core fixtures against scripts/package-size-budget.json.
      - run: pnpm check:size
      - run: pnpm check:package-size
      # One API report per published TypeScript entry (etc/*.api.md).
      - run: pnpm api:check
      # The default entries never reach the local evaluator (C-75).
      - run: pnpm check:entry-graph
      # The three tarballs installed into an app outside the workspace, the
      # way an npm install resolves them, then typechecked, built and loaded
      # in Chromium.
      - uses: ./.github/actions/chromium
      - run: pnpm pack-install
        timeout-minutes: 5

  verify:
    needs: [checks, browser, package]
    # Runs even when a job before it failed, so the required check reports
    # the failure instead of staying "skipped"; a cancelled run stays
    # cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "checks, browser, package: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
