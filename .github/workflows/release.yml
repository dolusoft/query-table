name: Release

# Publishes a version of the three packages together: push a tag
# `v<version>` that equals the `version` of the root and of every
# packages/*/package.json (see CONTRIBUTING.md, "Releasing").
#
#   verify   read-only token: runs every check of CI, builds, packs one
#            tarball per package and the conformance suite
#            (conformance-<revision>.tgz and the release notes that pin it,
#            C-79), and uploads them as a workflow artifact.
#   publish  write token, no install and no repository code: downloads the
#            tarballs, creates one GitHub Release with all of them, checks
#            that every asset URL answers, and optionally tells one consumer
#            repository the URL of the Vue tarball:
#
#   secret   CONSUMER_DISPATCH_TOKEN  a token allowed to dispatch to that repo
#   variable CONSUMER_REPO            `owner/name` of that repo
#
# Without both the dispatch step is skipped and the release still succeeds.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pnpm version is the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The three packages are released together under one version.
      - name: Tag matches every package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          for dir in packages/*/; do
            own="$(node -p "require('./${dir}package.json').version")"
            if [ "$own" != "$version" ]; then
              echo "::error::${dir}package.json is $own, the release is $version."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm contract:check
      - run: pnpm schema:check
      - run: pnpm conformance:check
      - run: pnpm playground:build
      - run: pnpm test:coverage

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:browser
        timeout-minutes: 5
      - run: pnpm check:renders
        timeout-minutes: 5
      # One build of dist/; the checks below and the pack use it.
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm check:deps
      - run: pnpm check:size
      - run: pnpm check:package-size
      - run: pnpm api:check
      - run: pnpm pack-install
        timeout-minutes: 5

      # One tarball per package; pnpm writes the version in place of
      # `workspace:*`. The Vue tarball is the one a consumer adds.
      - name: Pack
        id: pack
        run: |
          mkdir -p release
          for dir in packages/query-protocol packages/query-table-core packages/vue; do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/release")
          done
          count="$(find release -maxdepth 1 -name '*.tgz' | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected three tarballs in release/, found $count."
            exit 1
          fi
          echo "name=dolusoft-query-table-${{ steps.version.outputs.version }}.tgz" >> "$GITHUB_OUTPUT"
          test -f "release/dolusoft-query-table-${{ steps.version.outputs.version }}.tgz"
          # The conformance suite as an asset of its own, pinned by the notes.
          node scripts/pack-conformance.mjs release-extra
          test -f release-extra/release-notes.md
          count="$(find release-extra -maxdepth 1 -name 'conformance-*.tgz' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one conformance tarball in release-extra/, found $count."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: |
            release/*.tgz
            release-extra/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      NAME: ${{ needs.verify.outputs.tarball }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The artifact keeps the common root of its paths: release/ and
      # release-extra/ land side by side in the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: .

      # The three tarballs and the conformance suite go up together, in one
      # release; the notes that pin the suite come before the generated ones.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run may only replace the assets of the same commit: if the
            # tag now names another commit, stop instead of overwriting.
            tagged="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG exists for commit $tagged, this run is for $GITHUB_SHA."
              exit 1
            fi
            gh release upload "$TAG" release/*.tgz release-extra/*.tgz --clobber
          else
            gh release create "$TAG" release/*.tgz release-extra/*.tgz --title "$TAG" \
              --notes-file release-extra/release-notes.md --generate-notes --verify-tag
          fi

      # Every asset answers; the output is the URL of the Vue tarball.
      - name: Check the asset URLs
        id: asset
        run: |
          for file in release/*.tgz release-extra/*.tgz; do
            url="https://github.com/${GH_REPO}/releases/download/${TAG}/$(basename "$file")"
            ok=""
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sSL -o /dev/null -w '%{http_code}' "$url" || true)"
              echo "attempt $attempt: $status $url"
              if [ "$status" = "200" ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::The release asset does not answer 200: $url"
              exit 1
            fi
          done
          echo "url=https://github.com/${GH_REPO}/releases/download/${TAG}/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Tell the consumer repository
        env:
          DISPATCH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          CONSUMER_REPO: ${{ vars.CONSUMER_REPO }}
          VERSION: ${{ needs.verify.outputs.version }}
          TARBALL_URL: ${{ steps.asset.outputs.url }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ] || [ -z "$CONSUMER_REPO" ]; then
            echo "CONSUMER_DISPATCH_TOKEN or CONSUMER_REPO is not set: no dispatch."
            exit 0
          fi
          payload="$(jq -n --arg version "$VERSION" --arg url "$TARBALL_URL" \
            '{event_type: "query-table-released", client_payload: {version: $version, tarballUrl: $url}}')"
          echo "$payload" | GH_TOKEN="$DISPATCH_TOKEN" gh api \
            --method POST "repos/$CONSUMER_REPO/dispatches" --input -
          echo "Dispatched query-table-released $VERSION to $CONSUMER_REPO."
