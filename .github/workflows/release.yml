name: Release

# Publishes a version of the four packages together (the three table
# packages and the reference skin, ADR 0023): push a tag
# `v<version>` that equals the `version` of the root and of every
# packages/*/package.json (see CONTRIBUTING.md, "Releasing").
#
#   version  the tag equals every package.json version, and is the next
#            minor or patch of the latest release (ADR 0019).
#   ci       read-only token: every check of CI (ci.yml, called as is).
#   pack     read-only token: builds, packs one tarball per package and the
#            conformance suite (conformance-<revision>.tgz and the note
#            that pins it, C-79), writes the release notes (the version's
#            section of CHANGELOG.md, then that pin), and uploads them as a
#            workflow artifact.
#   npm      no install and no repository code: publishes the same tarballs
#            to npm with trusted publishing (OIDC: no token, no OTP).
#            Each package on npmjs.com lists this repository and
#            `release.yml` as its trusted publisher.
#   publish  write token, no install and no repository code: creates one
#            GitHub Release with notes and the conformance suite only,
#            and checks that the conformance asset URL answers.
#   npm and publish both wait for a reviewer of the release environment.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The four packages are released together under one version: fails in
  # seconds, before any check runs, when the tag and a package.json differ.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag matches every package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          for dir in packages/*/; do
            own="$(node -p "require('./${dir}package.json').version")"
            if [ "$own" != "$version" ]; then
              echo "::error::${dir}package.json is $own, the release is $version."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only the next minor or the next patch of the latest release (ADR 0019).
      # The tag being released is left out, so a re-run passes.
      - name: Version is the next minor or patch
        run: node scripts/check-release-version.mjs --release

  # Every check of CI, from the same workflow file.
  ci:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  pack:
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pnpm version is the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # One tarball per package; pnpm writes the version in place of
      # `workspace:*`. The npm job publishes these files.
      - name: Pack
        run: |
          mkdir -p release
          for dir in packages/query-protocol packages/query-table-core packages/vue packages/query-table-skin; do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/release")
          done
          count="$(find release -maxdepth 1 -name '*.tgz' | wc -l)"
          if [ "$count" -ne 4 ]; then
            echo "::error::Expected four tarballs in release/, found $count."
            exit 1
          fi
          test -f "release/dolusoft-query-table-${{ needs.version.outputs.version }}.tgz"
          test -f "release/dolusoft-query-table-skin-${{ needs.version.outputs.version }}.tgz"
          # The conformance suite as an asset of its own, pinned by the notes.
          node scripts/pack-conformance.mjs release-extra
          test -f release-extra/release-notes.md
          count="$(find release-extra -maxdepth 1 -name 'conformance-*.tgz' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one conformance tarball in release-extra/, found $count."
            exit 1
          fi

      # The notes a consumer reads: the version's section of CHANGELOG.md,
      # then the conformance pin. Fails when the version has no section.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/changelog-notes.mjs "$VERSION" > release-extra/changelog.md
          {
            cat release-extra/changelog.md
            printf '\n### Conformance suite\n\n'
            cat release-extra/release-notes.md
          } > release-extra/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: |
            release/*.tgz
            release-extra/*
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: [version, pack]
    # Waits for a reviewer of the `release` environment (Zahid or Enes);
    # the npm trusted publisher accepts this environment only.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Dependencies first, then the reference skin, which depends on nothing
      # and dresses the table of the same version (ADR 0023).
      PACKAGES: query-protocol query-table-core query-table query-table-skin
    steps:
      # The artifact keeps the common root of its paths: release/ and
      # release-extra/ land side by side in the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest

      # Trusted publishing cannot create a package: the first version of a new
      # one is published by hand from this run's tarball, and its trusted
      # publisher set, before this job is approved (CONTRIBUTING.md,
      # "Releasing"). Checked before anything is published, so a release is
      # never half out.
      - name: Every package is on npm
        run: |
          for pkg in $PACKAGES; do
            if ! out="$(npm view "@dolusoft/$pkg" name 2>&1)"; then
              if printf '%s' "$out" | grep -q E404; then
                echo "::error::@dolusoft/$pkg is not on npm: publish its first version by hand (CONTRIBUTING.md, Releasing)."
              else
                printf '%s\n' "$out"
              fi
              exit 1
            fi
          done

      # A version already on npm is skipped, so a re-run is safe.
      - name: Publish
        run: |
          for pkg in $PACKAGES; do
            if npm view "@dolusoft/$pkg@$VERSION" version > /dev/null 2>&1; then
              echo "@dolusoft/$pkg@$VERSION is already published: skipped."
              continue
            fi
            npm publish "./release/dolusoft-$pkg-$VERSION.tgz" --access public
          done

  publish:
    needs: [version, pack]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The artifact keeps the common root of its paths: release/ and
      # release-extra/ land side by side in the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: .

      # Only the conformance suite is attached to the release; the notes are
      # the version's CHANGELOG.md section and the conformance pin, not notes
      # generated from pull request titles. Packages go to npm.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run may only replace the assets of the same commit: if the
            # tag now names another commit, stop instead of overwriting.
            tagged="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG exists for commit $tagged, this run is for $GITHUB_SHA."
              exit 1
            fi
            gh release upload "$TAG" release-extra/*.tgz --clobber
          else
            gh release create "$TAG" release-extra/*.tgz --title "$TAG" \
              --notes-file release-extra/notes.md --verify-tag
          fi

      # The conformance asset answers.
      - name: Check the asset URLs
        run: |
          for file in release-extra/*.tgz; do
            url="https://github.com/${GH_REPO}/releases/download/${TAG}/$(basename "$file")"
            ok=""
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sSL -o /dev/null -w '%{http_code}' "$url" || true)"
              echo "attempt $attempt: $status $url"
              if [ "$status" = "200" ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::The release asset does not answer 200: $url"
              exit 1
            fi
          done
