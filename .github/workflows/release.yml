name: Release

# Publishes a version of the three packages together: push a tag
# `v<version>` that equals the `version` of the root and of every
# packages/*/package.json (see CONTRIBUTING.md, "Releasing").
#
#   verify   read-only token: runs every check of CI, builds, packs one
#            tarball per package and the conformance suite
#            (conformance-<revision>.tgz and the release notes that pin it,
#            C-79), and uploads them as a workflow artifact.
#   npm      no install and no repository code: publishes the same tarballs
#            to npm with trusted publishing (OIDC: no token, no OTP).
#            Each package on npmjs.com lists this repository and
#            `release.yml` as its trusted publisher.
#   publish  write token, no install and no repository code: creates one
#            GitHub Release with notes and the conformance suite only,
#            and checks that the conformance asset URL answers.
#   npm and publish both wait for a reviewer of the release environment.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pnpm version is the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The three packages are released together under one version.
      - name: Tag matches every package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          for dir in packages/*/; do
            own="$(node -p "require('./${dir}package.json').version")"
            if [ "$own" != "$version" ]; then
              echo "::error::${dir}package.json is $own, the release is $version."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm contract:check
      - run: pnpm schema:check
      - run: pnpm conformance:check
      - run: pnpm playground:build
      - run: pnpm test:coverage

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:browser
        timeout-minutes: 5
      - run: pnpm check:renders
        timeout-minutes: 5
      # One build of dist/; the checks below and the pack use it.
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm check:deps
      - run: pnpm check:size
      - run: pnpm check:package-size
      - run: pnpm api:check
      - run: pnpm pack-install
        timeout-minutes: 5

      # One tarball per package; pnpm writes the version in place of
      # `workspace:*`. The npm job publishes these files.
      - name: Pack
        run: |
          mkdir -p release
          for dir in packages/query-protocol packages/query-table-core packages/vue; do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/release")
          done
          count="$(find release -maxdepth 1 -name '*.tgz' | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected three tarballs in release/, found $count."
            exit 1
          fi
          test -f "release/dolusoft-query-table-${{ steps.version.outputs.version }}.tgz"
          # The conformance suite as an asset of its own, pinned by the notes.
          node scripts/pack-conformance.mjs release-extra
          test -f release-extra/release-notes.md
          count="$(find release-extra -maxdepth 1 -name 'conformance-*.tgz' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one conformance tarball in release-extra/, found $count."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: |
            release/*.tgz
            release-extra/*
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: verify
    # Waits for a reviewer of the `release` environment (Zahid or Enes);
    # the npm trusted publisher accepts this environment only.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # The artifact keeps the common root of its paths: release/ and
      # release-extra/ land side by side in the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest

      # Dependencies first. A version already on npm is skipped, so a re-run
      # is safe.
      - name: Publish
        run: |
          for pkg in query-protocol query-table-core query-table; do
            if npm view "@dolusoft/$pkg@$VERSION" version > /dev/null 2>&1; then
              echo "@dolusoft/$pkg@$VERSION is already published: skipped."
              continue
            fi
            npm publish "./release/dolusoft-$pkg-$VERSION.tgz" --access public
          done

  publish:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The artifact keeps the common root of its paths: release/ and
      # release-extra/ land side by side in the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: .

      # Only the conformance suite is attached to the release; the notes
      # that pin it come before the generated ones. Packages go to npm.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run may only replace the assets of the same commit: if the
            # tag now names another commit, stop instead of overwriting.
            tagged="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG exists for commit $tagged, this run is for $GITHUB_SHA."
              exit 1
            fi
            gh release upload "$TAG" release-extra/*.tgz --clobber
          else
            gh release create "$TAG" release-extra/*.tgz --title "$TAG" \
              --notes-file release-extra/release-notes.md --generate-notes --verify-tag
          fi

      # The conformance asset answers.
      - name: Check the asset URLs
        run: |
          for file in release-extra/*.tgz; do
            url="https://github.com/${GH_REPO}/releases/download/${TAG}/$(basename "$file")"
            ok=""
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sSL -o /dev/null -w '%{http_code}' "$url" || true)"
              echo "attempt $attempt: $status $url"
              if [ "$status" = "200" ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::The release asset does not answer 200: $url"
              exit 1
            fi
          done
