name: PR body

# The pull request template asks for an `İlkeler:` and a `Katman:` line; this
# job fails when either is missing (scripts/check-pr-body.mjs).

on:
  pull_request:
    branches: [main, next, 'v3/**']
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-body:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-pr-body.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
