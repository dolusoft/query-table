name: PR body

# The pull request template asks for an `İlkeler:` and a `Katman:` line; this
# job fails when either is missing (scripts/check-pr-body.mjs), when a rule or
# the API changes without a CHANGELOG.md entry (scripts/check-changelog.mjs),
# or when a commit credits an AI co-author.

on:
  pull_request:
    branches: [main, next, 'v3/**']
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-body:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/check-pr-body.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      # A change to contract/rules.md or contract/api.json comes with a
      # CHANGELOG.md entry, or a `Changelog: yok` line in the body
      # (scripts/check-changelog.mjs). Editing the body re-runs it.
      - run: git diff --name-only "$BASE...$HEAD" | node scripts/check-changelog.mjs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
      # GitHub lists every co-author trailer as a contributor; an AI one fails
      # the job (scripts/check-commit-trailers.mjs).
      - run: git log --format=%B "$BASE..$HEAD" | node scripts/check-commit-trailers.mjs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
