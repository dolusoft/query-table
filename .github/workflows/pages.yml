name: Playground

# Builds both playground channels and publishes one site to GitHub Pages.
# Needs Pages enabled in the repository settings with "GitHub Actions" as
# the source.

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Read only by default: `build` installs the development dependencies and runs
# their code, so the right to publish is given to `deploy` alone.
permissions:
  contents: read

env:
  # A stalled download of the pnpm store cache is given up after 2 minutes
  # (the default is 10), as in ci.yml.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

concurrency:
  group: pages
  # Let an active deployment finish; the next run rebuilds both branch tips.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: release

      - name: Check out next
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: next
          path: next

      # The pnpm version is the `packageManager` field of package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: release/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            release/pnpm-lock.yaml
            next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: release
      - run: pnpm playground:build
        working-directory: release
        env:
          PLAYGROUND_BASE: /${{ github.event.repository.name }}/
          PLAYGROUND_CHANNEL: release

      - run: pnpm install --frozen-lockfile
        working-directory: next
      - run: pnpm playground:build
        working-directory: next
        env:
          PLAYGROUND_BASE: /${{ github.event.repository.name }}/next/
          PLAYGROUND_CHANNEL: next

      - name: Assemble both channels
        run: |
          mkdir -p site/next
          cp -a release/apps/playground/dist/. site/
          cp -a next/apps/playground/dist/. site/next/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # deploy-pages publishes the artifact with an OIDC token of the run.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5