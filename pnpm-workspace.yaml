# The packages are published (ADR 0003); apps/ holds the playground, which is
# never part of a package.
packages:
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: false
  vue-demi: true

minimumReleaseAgeExclude:
  - '@oxlint/binding-android-arm-eabi@1.94.0'
  - '@oxlint/binding-android-arm64@1.94.0'
  - '@oxlint/binding-darwin-arm64@1.94.0'
  - '@oxlint/binding-darwin-x64@1.94.0'
  - '@oxlint/binding-freebsd-x64@1.94.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.94.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.94.0'
  - '@oxlint/binding-linux-arm64-gnu@1.94.0'
  - '@oxlint/binding-linux-arm64-musl@1.94.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.94.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.94.0'
  - '@oxlint/binding-linux-riscv64-musl@1.94.0'
  - '@oxlint/binding-linux-s390x-gnu@1.94.0'
  - '@oxlint/binding-linux-x64-gnu@1.94.0'
  - '@oxlint/binding-linux-x64-musl@1.94.0'
  - '@oxlint/binding-openharmony-arm64@1.94.0'
  - '@oxlint/binding-win32-arm64-msvc@1.94.0'
  - '@oxlint/binding-win32-ia32-msvc@1.94.0'
  - '@oxlint/binding-win32-x64-msvc@1.94.0'
  - oxlint@1.94.0

patchedDependencies:
  '@vitest/browser@5.0.5': patches/@vitest__browser@5.0.5.patch

# Development tools only; the published packages do not depend on these (#233).
overrides:
  # GHSA for minimatch below 11.0.1 (Dependabot #34). @microsoft/api-extractor
  # still pins 10.2.3, and @ts-morph/common and js-beautify ask for 10.x.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.5
  # stylus comes in only as an optional peer of vite, and nothing here uses
  # it. Through css and source-map-resolve it brings decode-uri-component
  # 0.2.2 (Dependabot #2, #32), whose fixed versions are ESM only and cannot
  # be required by source-map-resolve.
  stylus: '-'
